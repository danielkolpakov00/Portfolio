<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Interactive 3D weather visualization with day/night cycle based on Vancouver time">
  <title>Interactive Weather Visualization</title>
  
  <!-- Import map to handle bare specifiers -->
  <script type="importmap">
    {
      "imports": {
        "three": "../../node_modules/three/build/three.module.js",
        "three/": "../../node_modules/three/",
        "gsap": "../../node_modules/gsap/index.js"
      }
    }
  </script>
  
  <!-- Add base target to prevent iframe navigation issues -->
  <base target="_parent">
  
  <!-- Resource hints for faster loading -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  
  <!-- Load Inter font optimized for text rendering -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  
  <!-- Use FontAwesome from CDN instead of local module -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- CSS only -->
  <link href="weatherapi.css" rel="stylesheet">
  
  <style>
    /* Inline critical CSS for proper iframe positioning */
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    
    /* Ensure all contents are positioned relative to the viewport */
    main {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>
  <!-- Loading screen with enhanced progress indication -->
  <div id="loadingScreen">
    <div class="loading-container">
      <div class="loading-spinner"></div>
      <div class="loading-text">Loading Weather Visualization</div>
      <div class="progress-container">
        <div class="progress-bar"></div>
      </div>
      <div class="loading-progress">0%</div>
      <div class="loading-status">Initializing...</div>
    </div>
  </div>
  
  <main>
    <div id="weatherDisplay" aria-live="polite" role="status"></div>
    <div id="gradientOverlay" aria-hidden="true"></div>
    <div id="sunriseOverlay" aria-hidden="true"></div>
    <div id="timeDisplay" aria-label="Current time"></div>
    
    <div id="controlGroup">
      <input type="range" id="timeSlider" min="0" max="1440" step="1" value="720" 
             aria-label="Time control slider">
      
      <div class="buttonRow">
        <button id="precipButton" class="control-button" aria-label="Precipitation controls" 
                title="Weather Controls">
          <i class="fa-solid fa-cloud-rain icon"></i>
        </button>
        <button id="playButton" class="control-button" aria-label="Play/pause time" 
                title="Play/Pause Time">
          <i class="fa-solid fa-play icon"></i>
        </button>
        <button id="debugButton" class="control-button" aria-label="Debug mode" 
                title="Time Controls">
          <i class="fa-solid fa-clock icon"></i>
        </button>
      </div>
      
      <div id="precipControls">
        <select id="precipType" aria-label="Precipitation type">
          <option value="none">Clear</option>
          <option value="rain">Rain</option>
          <option value="snow">Snow</option>
        </select>
        <input type="range" id="precipIntensity" min="0" max="100" value="50" 
               aria-label="Precipitation intensity">
      </div>
    </div>
  </main>
  
  <script type="module" src="weatherapi.js"></script>
</body>
</html>
